<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Player</title>
  <link rel="stylesheet" href="./mini-player.css" />
</head>
<body>
  <div class="mini-shell" id="miniShell">
    <div class="mini-art-wrap">
      <div class="mini-art" id="miniArt">♪</div>
    </div>

    <div class="mini-info">
      <div class="mini-title" id="miniTitle" data-i18n="appName">Hybrid Neon Player</div>
      <div class="mini-sub" id="miniSub" data-i18n="bgPlaying">Playing in background</div>
    </div>

    <div class="mini-center">
      <div class="mini-progress" id="miniProgress">
        <div id="miniProgressFill"></div>
      </div>
      <div class="mini-time-row">
        <span id="miniCurrent">00:00</span>
        <span id="miniState" data-i18n="ready">READY</span>
        <span id="miniDuration">00:00</span>
      </div>
    </div>

    <div class="mini-controls">
      <button id="miniPrevBtn" data-i18n-title="prev" title="Önceki">
        <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="12,5 3,12 12,19" fill="currentColor"/><rect x="14" y="5" width="3" height="14" rx="1" fill="currentColor"/></svg>
      </button>
      <button id="miniPlayBtn" class="mini-play" data-i18n-title="togglePlay" title="Oynat/Duraklat">
        <svg viewBox="0 0 24 24" width="18" height="18"><polygon points="8,4 20,12 8,20" fill="currentColor"/></svg>
      </button>
      <button id="miniNextBtn" data-i18n-title="next" title="Sonraki">
        <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="12,5 21,12 12,19" fill="currentColor"/><rect x="7" y="5" width="3" height="14" rx="1" fill="currentColor"/></svg>
      </button>

      <div class="mini-volume">
        <button id="miniMuteBtn" data-i18n-title="mute" title="Ses Kapat"></button>
        <input id="miniVolumeSlider" type="range" min="0" max="1" step="0.01" value="1" />
      </div>

      <button id="miniRestoreBtn" data-i18n-title="restore" title="Geri Yükle">
        <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
      </button>
      <button id="miniCloseBtn" data-i18n-title="close" title="Kapat">
        <svg viewBox="0 0 24 24" width="16" height="16"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <script src="./mini-player.js"></script>
</body>
</html>

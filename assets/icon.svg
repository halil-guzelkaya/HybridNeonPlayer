<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4da6;stop-opacity:1" />
    </linearGradient>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowInner">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)" stroke="#1a1a4e" stroke-width="2"/>

  <!-- Subtle grid lines for tech feel -->
  <line x1="16" y1="256" x2="496" y2="256" stroke="#0d1040" stroke-width="1" opacity="0.5"/>
  <line x1="256" y1="16" x2="256" y2="496" stroke="#0d1040" stroke-width="1" opacity="0.5"/>

  <!-- Film reel - left side -->
  <circle cx="155" cy="256" r="90" fill="none" stroke="url(#neonBlue)" stroke-width="4" filter="url(#glowBlue)" opacity="0.9"/>
  <circle cx="155" cy="256" r="65" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <circle cx="155" cy="256" r="20" fill="url(#neonBlue)" filter="url(#glowInner)"/>
  <!-- Film reel holes -->
  <circle cx="155" cy="176" r="12" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <circle cx="155" cy="336" r="12" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <circle cx="75" cy="256" r="12" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <circle cx="235" cy="256" r="12" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <circle cx="105" cy="200" r="10" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="205" cy="200" r="10" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="105" cy="312" r="10" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="205" cy="312" r="10" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Music note - right side -->
  <g filter="url(#glowPink)" transform="translate(305, 130)">
    <!-- Note stem -->
    <rect x="72" y="0" width="6" height="180" rx="3" fill="url(#neonPink)"/>
    <!-- Note flag -->
    <path d="M78,0 Q110,30 78,65" fill="none" stroke="url(#neonPink)" stroke-width="5" stroke-linecap="round"/>
    <!-- Note head -->
    <ellipse cx="58" cy="185" rx="30" ry="22" transform="rotate(-20, 58, 185)" fill="url(#neonPink)"/>
  </g>

  <!-- Second smaller note -->
  <g filter="url(#glowPink)" transform="translate(340, 90) scale(0.5)">
    <rect x="72" y="0" width="5" height="140" rx="2.5" fill="#ff4da6" opacity="0.7"/>
    <path d="M77,0 Q100,25 77,50" fill="none" stroke="#ff4da6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="58" cy="145" rx="25" ry="18" transform="rotate(-20, 58, 145)" fill="#ff4da6" opacity="0.7"/>
  </g>

  <!-- Play triangle overlay -->
  <polygon points="240,216 240,296 300,256" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.3" stroke-linejoin="round"/>

  <!-- Neon border glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="url(#neonBlue)" stroke-width="2" opacity="0.4"/>
</svg>
